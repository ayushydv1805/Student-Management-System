name: Java build and database validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_management_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate MySQL schema and sample data
        env:
          MYSQL_PWD: root
        run: |
          mysql --host=127.0.0.1 --user=root < database/schema.sql
          mysql --host=127.0.0.1 --user=root < database/sample-data.sql
          student_count=$(mysql --host=127.0.0.1 --user=root --batch --skip-column-names -e "SELECT COUNT(*) FROM student_management_db.students")
          department_count=$(mysql --host=127.0.0.1 --user=root --batch --skip-column-names -e "SELECT COUNT(*) FROM student_management_db.departments")
          course_count=$(mysql --host=127.0.0.1 --user=root --batch --skip-column-names -e "SELECT COUNT(*) FROM student_management_db.courses")
          test "$student_count" -ge 2
          test "$department_count" -ge 3
          test "$course_count" -ge 1
          mysql --host=127.0.0.1 --user=root student_management_db -e "INSERT IGNORE INTO enrollments(student_id,course_id,academic_year,semester) SELECT s.student_id,c.course_id,'2026-27',3 FROM students s CROSS JOIN courses c WHERE s.roll_no='CSE2026001' AND c.course_code='CS301'"
          enrollment_count=$(mysql --host=127.0.0.1 --user=root --batch --skip-column-names -e "SELECT COUNT(*) FROM student_management_db.enrollments")
          test "$enrollment_count" -ge 1
          if mysql --host=127.0.0.1 --user=root student_management_db -e "INSERT INTO enrollments(student_id,course_id,academic_year,semester) SELECT s.student_id,c.course_id,'2026-27',3 FROM students s CROSS JOIN courses c WHERE s.roll_no='CSE2026001' AND c.course_code='CS301'"; then
            echo "Duplicate enrollment was unexpectedly accepted."
            exit 1
          else
            echo "Duplicate enrollment correctly rejected by the unique constraint."
          fi
          mysql --host=127.0.0.1 --user=root student_management_db -e "INSERT INTO attendance(enrollment_id,attendance_date,attendance_status) SELECT enrollment_id,CURRENT_DATE,\x27PRESENT\x27 FROM enrollments WHERE academic_year=\x272026-27\x27 AND semester=3 LIMIT 1; INSERT INTO assessments(course_id,assessment_name,max_marks,assessment_date) SELECT course_id,\x27CI assessment\x27,30,CURRENT_DATE FROM courses WHERE course_code=\x27CS301\x27; INSERT INTO marks(assessment_id,student_id,marks_obtained) SELECT a.assessment_id,e.student_id,25 FROM assessments a JOIN enrollments e ON e.course_id=a.course_id WHERE a.assessment_name=\x27CI assessment\x27 AND e.academic_year=\x272026-27\x27 AND e.semester=3 LIMIT 1;"
          attendance_count=$(mysql --host=127.0.0.1 --user=root --batch --skip-column-names -e "SELECT COUNT(*) FROM student_management_db.attendance")
          assessment_count=$(mysql --host=127.0.0.1 --user=root --batch --skip-column-names -e "SELECT COUNT(*) FROM student_management_db.assessments WHERE assessment_name=\x27CI assessment\x27")
          marks_count=$(mysql --host=127.0.0.1 --user=root --batch --skip-column-names -e "SELECT COUNT(*) FROM student_management_db.marks WHERE marks_obtained=25")
          test "$attendance_count" -ge 1
          test "$assessment_count" -ge 1
          test "$marks_count" -ge 1
          echo "Database validation passed: $student_count students, $department_count departments, $course_count courses, $enrollment_count enrollment(s), $attendance_count attendance record(s), $assessment_count assessment(s), and $marks_count mark(s)."
      - name: Build WAR
        run: mvn --batch-mode clean package
