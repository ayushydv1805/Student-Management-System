name: Java build and database validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_management_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate MySQL schema and sample data
        env:
          MYSQL_PWD: root
        run: |
          mysql --host=127.0.0.1 --user=root < database/schema.sql
          mysql --host=127.0.0.1 --user=root < database/sample-data.sql
          student_count=$(mysql --host=127.0.0.1 --user=root --batch --skip-column-names -e "SELECT COUNT(*) FROM student_management_db.students")
          department_count=$(mysql --host=127.0.0.1 --user=root --batch --skip-column-names -e "SELECT COUNT(*) FROM student_management_db.departments")
          test "$student_count" -ge 2
          test "$department_count" -ge 3
          echo "Database validation passed: $student_count sample students, $department_count departments."
      - name: Build WAR
        run: mvn --batch-mode clean package
