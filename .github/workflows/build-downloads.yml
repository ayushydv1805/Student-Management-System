name: Build CampusDesk downloads

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'desktop/**'
      - '.github/workflows/build-downloads.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        run: |
          curl --fail --location --silent --show-error https://services.gradle.org/distributions/gradle-8.9-bin.zip --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Build installable APK
        run: gradle --no-daemon --stacktrace -p android assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusDesk-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop app dependencies
        working-directory: desktop
        run: npm install
      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist -- --publish never
      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CampusDesk-Windows-Installer
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish permanent download links
    runs-on: ubuntu-latest
    needs: [android-apk, windows-installer]
    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: CampusDesk-Windows-Installer
          path: release-assets/windows
      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: CampusDesk-Android-APK
          path: release-assets/android
      - name: Prepare release files
        run: |
          set -euo pipefail
          windows_file="$(find release-assets/windows -type f -iname '*.exe' -print -quit)"
          android_file="$(find release-assets/android -type f -iname '*.apk' -print -quit)"
          test -n "$windows_file"
          test -n "$android_file"
          cp "$windows_file" release-assets/CampusDesk-Setup.exe
          cp "$android_file" release-assets/CampusDesk.apk
          file release-assets/CampusDesk-Setup.exe release-assets/CampusDesk.apk
          ls -lh release-assets/CampusDesk-Setup.exe release-assets/CampusDesk.apk
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: campusdesk-v1.0.0
          name: CampusDesk v1.0.0
          body: CampusDesk desktop and Android installers. Both apps connect to the hosted CampusDesk website and require internet access.
          files: |
            release-assets/CampusDesk-Setup.exe
            release-assets/CampusDesk.apk
          fail_on_unmatched_files: true
          make_latest: false
