services:
  - type: web
    name: campusdesk-student-management
    runtime: docker
    region: singapore
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: SMS_GATEWAY_URL
        value: https://nhqiaocrqjepzfidvkre.supabase.co/functions/v1/campusdesk-sql-gateway
      - key: SMS_GATEWAY_TOKEN
        sync: false
